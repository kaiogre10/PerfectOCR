models_config:
  use_angle_cls: False
  lang: "es"
  show_log: False
  use_gpu: False
  enable_mkldnn: True
  rec_batch_num: 32
  cpu_threads: 4
  max_batch_size: 32
  det_limit_side_len: 1280
  det_db_score_mode: 'slow'
  table: False
  use_mp: True
  max_text_length: 20
  rec_image_inverse: False
  
  det_model_dir: ["models", "paddle", "det", "es"]
  rec_model_dir: ["models", "paddle", "rec", "es"]
  wf_model_path: ["models", "wf", "wf_model.pkl"]
  # wf_model_path: "C:/word_finder_model/models/wf_model.pkl"
  set_wf_params: False
  
modules:
  image_preparation:
    ink_enhancement:
      aspect_ratio_range: [2.5, 13.8]
      angle_threshold: 41.25
      thr: 0.23
      black_thr: 0.726
      solid_thr: 0.95
      shape_thr: 0.327
      
    angle_corrector:
      min_angle_for_correction: 0.9
      canny_thresholds: [70, 120]
      hough_threshold: 150
      hough_min_line_length_cap_px: 250
      hough_max_line_gap_px: 20
      hough_angle_filter_range_degrees: [-22.5, 22.5]
      border_cutt: 100
      
    geometry_detect:
      morph_kernel: [2, 2]
      iterations: 2

    polygon_extractor:
      cropping_padding: 1.0

  preprocessing:
    restorer:
      area_threshold: 12
      kernel_threshold: 3

    moire:
      min_distance_from_center: 150
      notch_radius: 3
      percentile_threshold: 96
      mean_factor: 4
      abs_threshold: 20000000

    sp_config:
      kernel_size: 3
      salt_pepper_threshold: 0.015
      salt_pepper_low: 10
      salt_pepper_high: 250
      sobel_threshold: 0.85

    gauss_params:
      laplacian_variance_threshold: 80.0

    contrast:
      clahe_clip_limit: 2.0
      contrast_threshold: 50
      dimension_thresholds_px: [1000, 2500, 4000]
      grid_sizes_map: [[6, 6], [8, 8], [10, 10]]
    
    sharpening:
      sharpness_threshold: 50.0
      kernel: 3
        
  ocr:
    paddle_wrapper:
      min_confidence: 0.5307
      
    text_refiner:
      num_passes: 1
      encode_mean: [23.7, 103.7] # Promedio de densidad
      morph_mean: [-0.297, 0.337] # Promedio morfológico
  
    text_cleaner:
      min_probability: 75.0
    
  vectorization:
    lineal:
      get_vectors: True
      overlap_threshold: 0.596
      
    cos_sim:
      metric: "euclidean"
      eps: 0.91
      min_cluster: 2
      tolerance_sim: 2
      similarity_threshold: 0.915
      emergency_threshold: 0.817
      min_internal_sim: 0.439
    
    table_structurer:
      min_h: 3

    math_max:
      row_relative_tolerance: "0.10"

utils:
  dpi_range: [100, 200, 300, 400, 600, 1200]
  bin_interval: [10.0, 245.0]
  percentile: [0.10, 0.99]
  white: [255, 255, 255]
  black: [0, 0, 0]
  
exporting_config:
  cols_name: ["cantidad_art", "precio_unitario", "costo_tran", "producto_norm", "id_registro"]
  storage_dll: ["core", "utils", "compiled_utils", "buffer_handler.dll"]
  destinations:
    - postgre
    - excel
    - csv