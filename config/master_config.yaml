# config/master_config.yaml
pipeline_secuence:
  imagepre_stage:
    - "image_loader"
    - "angle_corrector"
    - "ink_enhancement"
    # - "moire"
    # - "geometry_detector"
    # - "polygon_extractor"

  preprocessing_stage:
    # - restorer
    # - "sp"
    # - "gauss"
    # - "clahe"
    # - "sharp"

  ocr_stage:
    #  - "paddle_wrapper"
    #  - "text_refiner"
    #  - "data_finder"
    
  vector_stage:
    # - "lineal"
    # - "vectorizer"
    # - "dbscan"
    # - "cos_sim"
    # - "table_structurer"
    # - "table_validated"
    # - "math_max"

# Configuración de salida
enabled_outputs:
  image_load_outputs:
    full_img: false
    bin_full_img: false
    angle_corrected: false
    moire_poly: false
    cropped_img: false
    final_polys: false
    discarded_polys: false
    deleted_polys: false
    opened: false
  
  preprocessing_outputs:
    contours: false
    components: false
    sp_poly: false 
    gauss_poly: false
    clahe_poly: false
    sharp_poly: false
  
  ocr_outputs:
    ocr_raw: false
    binarized_polygons: false
    cropp_blobs: false
    fragmented_polys: false
    reconstructed_lines: false
    semantic_field: false
  
  vectorization_outputs:
    table_lines: false
    features: false
    image_features: false
    table_structured: false
    math_max_corrected: false

models_config:
  use_angle_cls: false
  lang: "es"
  show_log: false
  use_gpu: false
  enable_mkldnn: true
  rec_batch_num: 64
  det_model_dir: C:/PerfectOCR/data/models/paddle/det/es
  rec_model_dir: C:/PerfectOCR/data/models/paddle/rec/es
  wf_model_path: C:/PerfectOCR/data/models/wf/wf_model.pkl
  set_wf_params: False
  
# Configuración de procesamiento
processing:
  valid_image_extensions: [.png, .jpg, .jpeg, .bmp, .tif, .tiff, .webp, .gif, .pbm, .pgm, .ppm, .jp2, .ico]
  small_batch_limit: 5

modules:
  image_preparation:

    ink_enhancement:
      iterations: 1
      white: [255, 255, 255]
      black: [0, 0, 0]
      start_restoring: True
      noise_kernel: [11, 11]
      restorer_kernel: [5, 5]
      isolation_range: [8.28, 245.601]
      threshold_black: 160
      threshold_white: 180
      aspect_ratio_range: [5.5, 10.0]
      angle_threshold: 15
      min_area: 6

    angle_corrector:
      min_angle_for_correction: 0.9
      canny_thresholds: [70, 120]
      hough_threshold: 150
      hough_min_line_length_cap_px: 250
      hough_max_line_gap_px: 20
      hough_angle_filter_range_degrees: [-22.5, 22.5]

    moire:
      min_distance_from_center: 150
      notch_radius: 3
      percentile_threshold: 96
      mean_factor: 4
      abs_threshold: 20000000
        
    geometry_detector:
      min_area: 1
      
    polygon_extractor:
      angle_thr: [44.9, 45.1]
      cropping_padding: 1

  preprocessing:
    restorer:
      area_threshold: 12
      kernel_threshold: 3

    sp_config:
      kernel_size: 3
      salt_pepper_threshold: 0.015
      salt_pepper_low: 10
      salt_pepper_high: 250
      sobel_threshold: 0.85

    gauss_params:
      laplacian_variance_threshold: 80.0

    contrast:
      clahe_clip_limit: 2.0
      contrast_threshold: 50
      dimension_thresholds_px: [1000, 2500, 4000]
      grid_sizes_map: [[6, 6], [8, 8], [10, 10]]
    
    sharpening:
      sharpness_threshold: 50.0
      kernel: 3
        
  ocr:
    paddle_wrapper:
      min_confidence: 60.0
      
    text_refiner:
      num_passes: 1
      c_value: 7
      height_thresholds_px: [100, 800, 1500, 2500]
      block_sizes_map: [15, 21, 25, 35, 41]
      min_area_factor: 0.015
      k_sigma: 1.25
      min_cc_for_frag: 2
      min_gap_outlier: 0.5
      density_threshold: 0.75
      width_var_threshold: 0.15
      solidity_threshold: 0.30
      connectivity: 8
  
    text_cleaner:
      min_probability: 75.0
      min_char: 2.0
      min_confidence: 70.0
      min_conf_to_clean: 90.0
    
    semantic_clasificator:
      semantic_range: [45.0, 66.5] # Cantidad de digitos
      encode_mean: [25.1, 39.1] # Promedio de densidad
      morph_mean: [-0.3, 0.35] # Promedio morfológico

    text_corrector:
      confidence_threshold: 0.90
    
  vectorization:
    lineal:
      overlap_threshold: 0.596
      
    vectorizer:
      keywords_interval_enabled: False
      exclude_types: [
        "descriptive",
        "code", 
        "umd"
      ]
      include_types: [
        "numeric",
        "quantitative"
      ]
      
    dbscan:
      eps: 1.0
      min_cluster_size: 2
      metric: "euclidean"

    cos_sim:
      min_cluster: 1
      similarity_threshold: 0.90
      emergency_threshold: 0.75
      interval: 2
      dummie_weights: [0.35, 0.65]
    
    table_structurer:
      min_h: 3

    math_max:
      total_mtl_abs_tolerance: 0.05
      row_relative_tolerance: 0.05

  utils:
    dpi_range: [100, 200, 300, 400, 600, 1200]
    bin_interval: [10, 245]
    percentile: [0.10, 0.99]
    morph_kernel: [2, 3]