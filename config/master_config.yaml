# config/master_config.yaml
pipeline_secuence:
  imagepre_stage:
    - "image_loader"
    # - "angle_corrector"
    # - "ink_enhancement"
    - "geometry_detector"
    - "polygon_extractor"

  preprocessing_stage:
    # - restorer
    # - "moire"
    # - "sp"
    # - "gauss"
    # - "clahe"
    # - "sharp"

  ocr_stage:
     - "paddle_wrapper"
     - "text_refiner"
    # - "data_finder"
    
  vector_stage:
    # - "lineal"
    # - "vectorizer"
    # - "dbscan"
    # - "cos_sim"
   # - "table_structurer"
    # - "table_validated"
    # - "math_max"

# Configuración de salida
enabled_outputs:
  image_load_outputs:
    full_img: False
    bin_full_img: False
    angle_corrected: False
    moire_poly: False
    cropped_img: False
    final_polys: False
    discarded_polys: False
    deleted_polys: False
    opened: False
  
  preprocessing_outputs:
    sp_poly: False
    gauss_poly: False
    clahe_poly: False
    sharp_poly: False

  ocr_outputs:
    ocr_raw: False
    binarized_polygons: False
    cropp_blobs: False
    fragmented_polys: False
    semantic_field: False
    cleanned_text: False
  
  vectorization_outputs:
    reconstructed_lines: False
    table_lines: False
    features: False
    image_features: False
    table_structured: False
    math_max_corrected: False

models_config:
  use_angle_cls: False
  lang: "es"
  show_log: True
  use_gpu: False
  enable_mkldnn: True
  rec_batch_num: 64
  
  det_model_dir: C:/PerfectOCR/data/models/paddle/det/es
  rec_model_dir: C:/PerfectOCR/data/models/paddle/rec/es
  wf_model_path: C:/PerfectOCR/data/models/wf/wf_model.pkl
  set_wf_params: False
  
# Configuración de procesamiento
processing:
  valid_image_extensions: [.png, .jpg, .jpeg, .bmp, .tif, .tiff, .webp, .gif, .pbm, .pgm, .ppm, .jp2, .ico]
  small_batch_limit: 5

modules:
  image_preparation:

    ink_enhancement:
      iterations: 1
      white: [255, 255, 255]
      black: [0, 0, 0]
      start_restoring: True
      noise_kernel: [11, 11]
      restorer_kernel: [3, 2]
      isolation_range: [8.28, 245.601]
      aspect_ratio_range: [5.6, 14.2]
      angle_threshold: 7.56
      min_area: 6

    angle_corrector:
      min_angle_for_correction: 0.9
      canny_thresholds: [70, 120]
      hough_threshold: 150
      hough_min_line_length_cap_px: 250
      hough_max_line_gap_px: 20
      hough_angle_filter_range_degrees: [-22.5, 22.5]
      border_cutt: 100
      border_color: [255, 255, 255]

    moire:
      min_distance_from_center: 150
      notch_radius: 3
      percentile_threshold: 96
      mean_factor: 4
      abs_threshold: 20000000
        
    geometry_detector:
      min_area: 1
      
    polygon_extractor:
      angle_thr: [44.9, 45.1]
      cropping_padding: 1

  preprocessing:
    restorer:
      area_threshold: 12
      kernel_threshold: 3

    sp_config:
      kernel_size: 3
      salt_pepper_threshold: 0.015
      salt_pepper_low: 10
      salt_pepper_high: 250
      sobel_threshold: 0.85

    gauss_params:
      laplacian_variance_threshold: 80.0

    contrast:
      clahe_clip_limit: 2.0
      contrast_threshold: 50
      dimension_thresholds_px: [1000, 2500, 4000]
      grid_sizes_map: [[6, 6], [8, 8], [10, 10]]
    
    sharpening:
      sharpness_threshold: 50.0
      kernel: 3
        
  ocr:
    paddle_wrapper:
      min_confidence: 60.0
      
    text_refiner:
      num_passes: 1
      c_value: 7
      height_thresholds_px: [100, 800, 1500, 2500]
      block_sizes_map: [15, 21, 25, 35, 41]
      min_area_factor: 0.015
      k_sigma: 1.25
      min_cc_for_frag: 2
      min_gap_outlier: 0.5
      density_threshold: 0.75
      width_var_threshold: 0.15
      solidity_threshold: 0.30
      connectivity: 8
  
    text_cleaner:
      min_probability: 75.0
      min_char: 2
      min_confidence: 70.0
      min_conf_to_clean: 90.2
    
    semantic_clasificator:
      semantic_range: [45.0, 66.5] # Cantidad de digitos
      encode_mean: [25.1, 39.1] # Promedio de densidad
      morph_mean: [-0.3, 0.35] # Promedio morfológico

    text_corrector:
      confidence_threshold: 0.902
    
  vectorization:
    lineal:
      get_vectors: True
      overlap_threshold: 0.596
      
    vectorizer:
      exclude_types: [
        "descriptive",
        "code", 
        "umd"
      ]
      include_types: [
        "numeric",
        "quantitative"
      ]
      
    dbscan:
      eps: 1.5
      min_cluster_size: 2
      metric: "euclidean"

    cos_sim:
      min_cluster: 1
      similarity_threshold: 0.91
      emergency_threshold: 0.83
      interval: 2
      dummie_weights: [0.35, 0.65]
    
    table_structurer:
      min_h: 3

    math_max:
      total_mtl_abs_tolerance: 0.05
      row_relative_tolerance: 0.05

  utils:
    dpi_range: [100, 200, 300, 400, 600, 1200]
    bin_interval: [10, 245]
    percentile: [0.10, 0.99]
    morph_kernel: [2, 3]