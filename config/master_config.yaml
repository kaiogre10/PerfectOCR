# config/master_config.yaml
system_params:
  payloads_size: 2          # Cantidad de memoria máxima (en unidades de información actualmente KB) que puede tener un payload antes de ser enviado

  system_paths:
    "output_paths": ["output"]
    "storage_bin": ["utils", "compiled_utils", "buffer_handler"]
    "container_bin": ["utils", "compiled_utils", "containers"]

deploy_settings:
  postgre_local: False      # Habilitar el servicio local de postgre
  handle_memory: True   # Interruptor para gestionar la memoria dinámica, exclusivamente para deploy
  deploy_mode: True     # Modo que permite inicializar el sistema completo sin validar la configuración
  test_config: False    # Modo evalua las configuraciones según modo deploy haciendo early exit el sistema
  clean_mode: False

pipeline_secuence:
  image_preparation_stager:
    - "image_loader"
    - "angle_corrector"
    # - "ink_enhancement"
    - "geometry_detector"
    - "polygon_extractor"

  preprocessing_stager:
    #  - "moire"
    - "sp"
    #  - "gauss"
    #  - "clahe"
    #  - "sharp"

  ocr_stager:
    - "paddle_wrapper"
    - "text_refiner"
    - "data_finder"
    
  vectorization_stager:
    - "lineal"
    - "cos_sim"
    - "table_structurer"
    - "math_max"
    - "collector"
       
log_debug:
  all_logs: False
  text_ocr: False
  text_del: False
  frag_polys: False
  text_clean: False
  text_correct: False
  refined_text: False
  seman_clas: False
  key_fields: False
  lines: False
  table_lines: False
  table_geo: False
  table_correct: False
  time_stages_log: False
  time_worker_log: False
  
  semantic_types_log: [2,3,4,5]
  kf_list_log: [7, 8,9,10,11,12]

# Configuración de salida
enabled_outputs:
  image_load_outputs:
    full_img: False
    bin_full_img: False
    angle_corrected: False
    cropped_img: False
    final_polys: False
    discarded_polys: False
    deleted_polys: False
    opened: False
  
  preprocessing_outputs:
    sp_poly: False
    gauss_poly: False
    clahe_poly: False
    sharp_poly: False

  ocr_outputs:
    ocr_raw: False
    fragmented_polys: False
    semantic_field: False
    cleanned_text: False
  
  vectorization_outputs:
    reconstructed_lines: False
    table_lines: False
    features: False
    image_features: False
    table_structured: False
    math_max_corrected: False
    normalized_table: False
    stack: False

models_config:
  use_angle_cls: False
  lang: "es"
  show_log: False
  use_gpu: False
  enable_mkldnn: True
  rec_batch_num: 32
  cpu_threads: 4
  max_batch_size: 32
  det_limit_side_len: 1280
  det_db_score_mode: 'slow'
  use_mp: True
  table: False
  max_text_length: 20
  return_word_box: False
  save_log_path: './log_output/'
  
  det_model_dir: ["models", "paddle", "det", "es"]
  rec_model_dir: ["models", "paddle", "rec", "es"]
  wf_model_path: ["models", "wf", "wf_model.pkl"]
  # wf_model_path: "C:/word_finder_model/models/wf_model.pkl"
  set_wf_params: False
  
modules:
  image_preparation:
    ink_enhancement:
      white: [255, 255, 255]
      black: [0, 0, 0]
      aspect_ratio_range: [2.5, 13.8]
      angle_threshold: 41.25
      thr: 0.23
      black_thr: 0.726
      solid_thr: 0.95
      shape_thr: 0.327
      
    angle_corrector:
      min_angle_for_correction: 0.9
      canny_thresholds: [70, 120]
      hough_threshold: 150
      hough_min_line_length_cap_px: 250
      hough_max_line_gap_px: 20
      hough_angle_filter_range_degrees: [-22.5, 22.5]
      
    geometry_detect:
      morph_kernel: [2, 2]
      iterations: 2

    polygon_extractor:
      cropping_padding: 1.0

  preprocessing:
    moire:
      min_distance_from_center: 150
      notch_radius: 3
      percentile_threshold: 96
      mean_factor: 4
      abs_threshold: 20000000

    sp_config:
      kernel_size: 3
      salt_pepper_threshold: 0.015
      salt_pepper_low: 10
      salt_pepper_high: 250
      sobel_threshold: 0.85

    gauss_params:
      laplacian_variance_threshold: 80.0

    contrast:
      clahe_clip_limit: 2.0
      contrast_threshold: 50
      dimension_thresholds_px: [1000, 2500, 4000]
      grid_sizes_map: [[6, 6], [8, 8], [10, 10]]
    
    sharpening:
      sharpness_threshold: 50.0
      kernel: 3
        
  ocr:
    paddle_wrapper:
      min_confidence: 0.5307
      
    text_refine:
      num_passes: 1

  vectorization:
    lineal:
      get_vectors: True
      overlap_threshold: 0.596
      
    cos_sim:
      metric: "euclidean"
      eps: 0.91
      min_cluster: 2
      tolerance_sim: 2
      similarity_threshold: 0.915
      emergency_threshold: 0.817
      min_internal_sim: 0.439
    
    table_structurer:
      min_h: 3

    math_max:
      row_relative_tolerance: "0.10"
      cols_name: [
        "cantidad_art",
        "precio_unitario",
        "costo_tran",
        "producto_norm",
        "id_registro"
      ]
      separator: ["_"]

env_config:
  'OMP_NUM_THREADS': '4'
  'MKL_NUM_THREADS': '4'
  'FLAGS_use_mkldnn': '1'
  'MKL_DYNAMIC': 'TRUE'
  'KMP_AFFINITY': 'granularity=fine, compact, 1, 0'
  'KMP_BLOCKTIME': '0'
  'OPENBLAS_NUM_THREADS': '1'
  'NUMEXPR_NUM_THREADS': '1'
  'MKL_DISABLE_FAST_MM': '0'
