# config/master_config.yaml
system_params:
  payloads_size: 2          # Cantidad de memoria máxima (en unidades de información actualmente KB) que puede tener un payload antes de ser enviado

  system_paths:
    output_paths: ["output"]
    libs_path: "bin"
    containers: "containers"
    buffer_handler: "buffer_handler"
    temp_path: ["safe_temp", "tmp_file.txt"]

deploy_settings:
  postgre_local: False     # Habilitar el servicio local de postgre
  handle_memory: False   # Interruptor para gestionar la memoria dinámica, exclusivamente para deploy
  test_config: False   # Modo evalua las configuraciones según modo deploy haciendo early exit el sistema
  clean_mode: False     # Modo de limpieza que solo ejecuta el módulo de limpieza de cache y datos basura
  update_model: False   # Modo de actualización de los valores de las matrices de Word Finder sin correr todo el sistema
  deploy_mode: True     # Modo que permite inicializar el sistema completo sin validar la configuración de manera estricta
  test_wf_model: False

pipeline_secuence:
  image_preparation_stager:
     - "image_loader"
     - "angle_corrector"
    # - "ink_enhancement"
     - "geometry_detector"
     - "polygon_extractor"

  preprocessing_stager:
    # - "moire"
    # - "sp"
    # - "gauss"
    # - "clahe"
    # - "sharp"

  ocr_stager:
    - "paddle_wrapper"
    - "text_refiner"
    - "data_finder"
    
  vectorization_stager:
    - "lineal"
    - "cos_sim"
    - "table_structurer"
    - "math_max"
    - "collector"

log_config:
  log_params:
    console_level: 'INFO'
    file_level: 'INFO'
    console_format: "%(asctime)s - %(filename)s:%(lineno)d - %(message)s"
    file_format: "%(filename)s:%(lineno)d - %(message)s"
    date_format: "%H:%M:%S"
    temp_date_format: "%d/%m/%Y-%H:%M:%S"
    temp_path_file: "safe_temp"

  logs_flags:           # <-- Activar logs para consola
    all_logs: False    # <-- Modo Que cambia tosdos los logs a True para trazabilidad
    text_ocr: False
    text_del: False
    frag_polys: False
    text_clean: False
    text_correct: False
    refined_text: False
    seman_clas: False
    key_fields: False
    lines: False
    table_lines: False
    table_geo: False
    table_correct: False
    time_stages_log: False
    time_worker_log: False
    
    semantic_types_log: [2, 3, 4, 5, 6]   # Range [0, 5]
    kf_list_log: [5] # Range [1, 12]

# Configuración de salida
enabled_outputs:
  image_load_outputs:
    full_img: False
    bin_full_img: False
    angle_corrected: False
    cropped_img: False
    final_polys: False
    discarded_polys: False
    opened: False
  
  preprocessing_outputs:
    sp_poly: False
    gauss_poly: False
    clahe_poly: False
    sharp_poly: False

  ocr_outputs:
    ocr_raw: False
    fragmented_polys: False
    semantic_field: False
    cleanned_text: False
  
  vectorization_outputs:
    reconstructed_lines: False
    table_lines: False
    training_data: False
    features: False
    image_features: False
    table_structured: False
    math_max_corrected: False
    normalized_table: False
    stack: False

env_config:
  'OMP_NUM_THREADS': '4'
  'MKL_NUM_THREADS': '4'
  'FLAGS_use_mkldnn': '1'
  'MKL_DYNAMIC': 'TRUE'
  'KMP_AFFINITY': 'granularity=fine, compact, 1, 0'
  'KMP_BLOCKTIME': '0'
  'OPENBLAS_NUM_THREADS': '1'
  'NUMEXPR_NUM_THREADS': '1'
  'MKL_DISABLE_FAST_MM': '0'